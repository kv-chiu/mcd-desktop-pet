name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号 Tag (例如: v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  test:
    name: 自动化测试 (Tests & Validation)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 构建测试依赖的项目产物
        run: pnpm build

      - name: 运行全量单元与集成测试
        run: pnpm test

  build-matrix:
    name: 构建跨平台产物 (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            archive: "mcd-desktop-pet-macos-*.zip"
          - platform: windows
            os: windows-latest
            archive: "mcd-desktop-pet-windows-*.zip"
          - platform: linux
            os: ubuntu-latest
            archive: "mcd-desktop-pet-linux-*.tar.gz"

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 安装与配置 Godot 4 引擎与导出模板
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          include-templates: true
          use-dotnet: false

      - name: 执行一键打包发布脚本 (build-release.py)
        run: python scripts/build-release.py --platform ${{ matrix.platform }}

      - name: 上传构建发布产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 下载各平台打包产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 整理发布产物并生成 SHA-256 校验清单
        id: prepare_assets
        run: |
          mkdir -p final_release
          cp -v artifacts/*.zip artifacts/*.tar.gz final_release/ 2>/dev/null || true
          cd final_release
          sha256sum * > checksums.sha256
          cat checksums.sha256
          echo "tag_name=${{ github.event.inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: 生成发布版本与说明文档
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag_name }}
          name: 麦当劳智能桌面宠物 ${{ steps.prepare_assets.outputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            final_release/*.zip
            final_release/*.tar.gz
            final_release/checksums.sha256
          body: |
            # 🍔 麦当劳智能桌面宠物 (McDonald's Desktop Pet) ${{ steps.prepare_assets.outputs.tag_name }}

            感谢使用麦当劳智能桌面宠物！本版本提供跨平台桌宠、中枢服务、Web 控制台与 Agent 技能扩展。启动中枢与 CLI 需要先安装 Node.js 22，已打包的桌宠无需安装 Godot。

            ---

            ## 📦 平台安装包下载与选择

            | 目标平台 / 用途 | 适用系统 | 文件名格式 | 核心特性 |
            | :--- | :--- | :--- | :--- |
            | **macOS 版** | macOS 12+ (Apple Silicon & Intel) | `mcd-desktop-pet-macos-*.zip` | 解压即用，原生透明置顶，包含 Universal 二进制与一键 `start.sh` |
            | **Windows 版** | Windows 10 / 11 (64位) | `mcd-desktop-pet-windows-*.zip` | 解压即用，单文件客户端，双击 `start.bat` 一键唤起桌宠与中枢 |
            | **Linux 版** | Ubuntu / Debian / Fedora / Arch | `mcd-desktop-pet-linux-*.tar.gz` | 原生 x86_64 客户端与全功能服务端 |
            | **AI Agent 独立技能包** | Claude Code / Cursor / Antigravity | `mcd-desktop-pet-skill-*.zip` | 零依赖纯 Python 技能扩展包，添加至 Agent skills 即刻可用 |

            ---

            ## 🚀 极速上手指南

            ### 1. 普通用户（双击开箱即用）
            1. 下载对应系统的压缩包并解压到任意文件夹。
            2. **macOS / Linux**：在终端或双击运行 `./start.sh`；停止时运行 `./stop.sh`。
            3. **Windows**：双击运行 `start.bat`；停止时双击 `stop.bat`。
            4. 系统将自动唤起桌面宠物并打开 Web 可视化控制大屏（`http://localhost:3001`）。

            ### 2. AI Agent 技能集成（添加 skill 即用）
            将 `skill/` 目录添加至您的 Agent 技能库：
            ```bash
            # 环境自检与设置 Token
            python3 skill/scripts/install.py --token <你的麦当劳Token>

            # 自然语言或命令行控制桌宠与麦当劳工具
            python3 skill/scripts/control.py pet --action wave --speech "主人下午好！"
            python3 skill/scripts/control.py tool --name list-nutrition-foods --params '{"keyword":"巨无霸"}'
            ```

            ---

            ## 🔐 校验和 (SHA-256)
            所有产物的完整哈希值请参考附件中的 `checksums.sha256`。
