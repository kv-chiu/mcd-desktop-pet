name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号 Tag (例如: v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  test:
    name: 自动化测试 (Tests & Validation)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 构建 Web 控制台前端产物
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build

      - name: 运行 Go 单元与集成测试
        run: go test -v ./...

      - name: 验证跨平台打包逻辑
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: 验证 Go 一体化主程序编译
        run: go build -v -o mcd-desktop-pet ./cmd/mcd-desktop-pet

  build-and-release:
    name: 构建跨平台发行包并发布 Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 构建 Web 控制台前端产物
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build

      - name: 执行一键打包发布流水线 (build-release.py)
        run: python3 scripts/build-release.py --platform all --skip-godot

      - name: 检查发布产物并提取版本标签
        id: release_info
        run: |
          ls -la dist/release/
          cat dist/release/SHA256SUMS.txt
          echo "tag_name=${{ github.event.inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: 创建并发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: 麦当劳便利贴桌面宠物 ${{ steps.release_info.outputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          body: |
            # 🍟 麦当劳便利贴桌面宠物 (McDonald's Desktop Pet) ${{ steps.release_info.outputs.tag_name }}

            感谢使用麦当劳便利贴桌面宠物！本版本提供基于 Go 原生中枢服务与 Godot 4 表现层的跨平台单文件/单应用包分发，彻底零外部运行时依赖（无需安装 Node.js、Python 或 Godot）。

            ---

            ## 📦 跨平台发行包下载

            | 目标平台 | 文件名 | 格式与运行方式 |
            | :--- | :--- | :--- |
            | **Windows (x64)** | `mcd-desktop-pet-*-windows-x64.zip` | 解压即用，包含 `mcd-desktop-pet.exe` 单文件，双击直接运行 |
            | **macOS (Apple Silicon)** | `mcd-desktop-pet-*-macos-arm64.zip` | 适用于 M1/M2/M3/M4 系列 Mac，解压拖入 Applications 双击打开 |
            | **macOS (Intel)** | `mcd-desktop-pet-*-macos-amd64.zip` | 适用于 Intel 系列 Mac，解压拖入 Applications 双击打开 |

            ---

            ## 🚀 极速上手

            1. **双击即玩**：下载解压对应平台的压缩包，直接双击运行主程序。桌面右下角将就席桌面宠物，常驻内存仅约 15MB。
            2. **桌面便利贴**：右键点击桌宠选择【📝 新建便利贴】或快捷键 `Ctrl+N` / `Cmd+N`；支持自由拖拽缩放与 `Ctrl+V` / `Cmd+V` 截图粘贴。
            3. **出餐归档**：点击便签右上角印章图标，触发专属印章动效并安全归档至历史便签盒。
            4. **管理大屏**：终端运行 `mcd-desktop-pet web` 或右键选择【历史便签盒】，自动打开现代深色 Web 控制台。
            5. **AI Agent 集成**：所有 CLI 命令默认输出纯 JSON，支持无缝对接 Claude Code / Cursor / Codex 等 Agent。

            ---

            ## 🔐 校验和 (SHA-256)
            所有发布包的 SHA-256 校验和详见附件 `SHA256SUMS.txt`。
